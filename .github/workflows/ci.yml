name: GUCC CI

# Keep CI deterministic: ordinary code pushes and pull requests only. Pages deployment_status events must never retrigger the full npm test suite.
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install isolated Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Run isolated Creator browser regression
        run: node scripts/test-creator-global-browser.cjs

      - name: Retain isolated browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: creator-global-browser-${{ github.run_id }}
          path: tmp/creator-global-browser/
          if-no-files-found: ignore
          retention-days: 7
