<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>终末地暂无合适的非官方参考站</title>
  <style>
    :root {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #f3fbff;
      background: #070c12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 16% 18%, rgba(0, 205, 232, 0.18), transparent 34%),
        radial-gradient(circle at 84% 80%, rgba(122, 232, 164, 0.13), transparent 32%),
        #070c12;
    }

    main {
      width: min(720px, 100%);
      padding: 54px 44px;
      text-align: center;
      background: rgba(13, 20, 29, 0.94);
      border: 1px solid rgba(71, 211, 232, 0.25);
      border-radius: 30px;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.46);
    }

    .mark {
      width: 104px;
      height: 104px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 2px solid #4bd9eb;
      border-radius: 28px;
      color: #061016;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(145deg, #d9fbff, #47d3e8);
      box-shadow: 0 14px 34px rgba(71, 211, 232, 0.24);
    }

    .status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 14px;
      border-radius: 999px;
      color: #a8edf5;
      background: rgba(71, 211, 232, 0.12);
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.22;
    }

    .lead {
      margin: 22px auto 0;
      max-width: 600px;
      color: #bdc8d2;
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.75;
    }

    .official {
      margin-top: 32px;
      padding: 24px;
      border: 1px solid rgba(71, 211, 232, 0.2);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
    }

    .official strong {
      display: block;
      margin-bottom: 8px;
      font-size: 19px;
    }

    .official span {
      color: #9eabb6;
      line-height: 1.65;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 18px;
      border-radius: 12px;
      color: #061016;
      background: #a8edf5;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #ffffff;
      outline: 3px solid rgba(168, 237, 245, 0.28);
      outline-offset: 3px;
    }

    .note {
      margin: 28px 0 0;
      color: #73808b;
      font-size: 14px;
    }

    @media (max-width: 620px) {
      main {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">终末地</div>
    <div class="status">非官方资料站状态提醒</div>
    <h1>暂无合适的非官方参考站</h1>
    <p class="lead">目前没有找到适合作为一键参考入口的《明日方舟：终末地》非官方角色资料站，请优先查看官方网站。</p>

    <section class="official">
      <strong>森空岛官方角色图鉴</strong>
      <span>角色资料请以官方页面和游戏内实际内容为准。</span><br>
      <a href="https://wiki.skland.com/endfield/catalog?typeMainId=1&amp;typeSubId=1" target="_blank" rel="noopener noreferrer">打开终末地官方角色图鉴</a>
    </section>

    <p class="note">这是本地提示页面，不会读取账号信息，也不会自动跳转。</p>
  </main>
</body>
</html>
